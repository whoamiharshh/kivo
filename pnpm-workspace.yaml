packages:
  - "apps/*"
  - "packages/*"

# Dependencies with native build steps that are deliberately NOT run.
#
# Each is an optional speed-up with a pure-JavaScript fallback (keccak,
# bufferutil, utf-8-validate), or a dev-tool helper (unrs-resolver), or a
# post-install notice (@reown/appkit). The app has always run without them.
#
# Without this decision written down, pnpm 12 stops a clean install with
# ERR_PNPM_IGNORED_BUILDS, which would fail the install step on a fresh checkout
# or on Vercel. `allowBuilds` is the pnpm 12 name; `ignoredBuiltDependencies`
# is the pnpm 10 name — both are listed so either version installs cleanly.
allowBuilds:
  "@reown/appkit": false
  bufferutil: false
  keccak: false
  unrs-resolver: false
  utf-8-validate: false
ignoredBuiltDependencies:
  - "@reown/appkit"
  - bufferutil
  - keccak
  - unrs-resolver
  - utf-8-validate
